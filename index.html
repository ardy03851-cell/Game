<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Jumper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Courier New', monospace;
      touch-action: manipulation;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    #gameCanvas {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #87CEEB;
      border: 4px solid #2d3436;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      height: auto;
    }

    #score {
      text-align: center;
      color: white;
      font-size: 28px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #startScreen,
    #gameOverScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 3px solid #fff;
      z-index: 10;
    }

    #startScreen h1,
    #gameOverScreen h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #FFE66D;
    }

    #startScreen p,
    #gameOverScreen p {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    button {
      background: #FF6B6B;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      font-family: 'Courier New', monospace;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 4px 0 #C44545;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #C44545;
    }

    .hidden {
      display: none !important;
    }

    #finalScore {
      font-size: 24px;
      color: #4ECDC4;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="gameContainer">
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="startScreen">
      <h1>PIXEL JUMPER</h1>
      <p>Tap screen or press SPACE to jump<br>Avoid the obstacles!</p>
      <button id="startBtn">START GAME</button>
    </div>

    <div id="gameOverScreen" class="hidden">
      <h1>GAME OVER</h1>
      <div id="finalScore">Score: 0</div>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreElement = document.getElementById('finalScore');

        // Game state
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 5;
        let frameCount = 0;

        // Player (pixel art will be drawn here)
        const player = {
            x: 100,
            y: 300,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.8,
            jumpStrength: -15,
            grounded: false
        };

        // Obstacles
        let obstacles = [];
        const obstacleWidth = 30;
        const obstacleHeight = 40;

        // Ground
        const groundY = 340;

        // Draw pixel art function
        function drawPixelArt(x, y, pixels, pixelSize) {
            pixels.forEach((row, rowIndex) => {
                row.forEach((color, colIndex) => {
                    if (color !== 'transparent') {
                        ctx.fillStyle = color;
                        ctx.fillRect(
                            x + colIndex * pixelSize,
                            y + rowIndex * pixelSize,
                            pixelSize,
                            pixelSize
                        );
                    }
                });
            });
        }

        // Player pixel art (10x10 grid) - REPLACE WITH YOUR ART
        const playerPixels = [
            ['transparent', 'transparent', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', 'transparent', 'transparent', 'transparent', 'transparent'],
            ['transparent', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', 'transparent', 'transparent', 'transparent'],
            ['transparent', '#FFE66D', '#000000', '#FFE66D', '#FFE66D', '#000000', '#FFE66D', 'transparent', 'transparent', 'transparent'],
            ['transparent', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', '#FFE66D', 'transparent', 'transparent', 'transparent'],
            ['transparent', 'transparent', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', 'transparent', 'transparent', 'transparent', 'transparent'],
            ['transparent', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', 'transparent', 'transparent', 'transparent'],
            ['transparent', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', '#FF6B6B', 'transparent', 'transparent', 'transparent'],
            ['transparent', 'transparent', '#4ECDC4', '#4ECDC4', '#4ECDC4', '#4ECDC4', 'transparent', 'transparent', 'transparent', 'transparent'],
            ['#4ECDC4', '#4ECDC4', '#4ECDC4', '#4ECDC4', '#4ECDC4', '#4ECDC4', '#4ECDC4', 'transparent', 'transparent', 'transparent'],
            ['#4ECDC4', '#4ECDC4', 'transparent', 'transparent', 'transparent', 'transparent', '#4ECDC4', '#4ECDC4', 'transparent', 'transparent']
        ];

        // Obstacle pixel art (6x8 grid) - REPLACE WITH YOUR ART
        const obstaclePixels = [
            ['transparent', 'transparent', '#8B4513', '#8B4513', 'transparent', 'transparent'],
            ['transparent', '#8B4513', '#8B4513', '#8B4513', '#8B4513', 'transparent'],
            ['#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513'],
            ['#8B4513', '#8B4513', '#A0522D', '#A0522D', '#8B4513', '#8B4513'],
            ['#8B4513', '#8B4513', '#A0522D', '#A0522D', '#8B4513', '#8B4513'],
            ['#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513'],
            ['#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513', '#8B4513'],
            ['transparent', 'transparent', '#8B4513', '#8B4513', 'transparent', 'transparent']
        ];

        // Draw background
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(100, 50, 80, 30);
            ctx.fillRect(150, 40, 60, 25);
            ctx.fillRect(500, 80, 100, 35);
            ctx.fillRect(560, 70, 70, 30);

            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, groundY, canvas.width, 10);
        }

        // Update player physics
        function updatePlayer() {
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }
        }

        // Jump function
        function jump() {
            if (player.grounded && gameRunning) {
                player.velocityY = player.jumpStrength;
                player.grounded = false;
            }
        }

        // Spawn obstacle
        function spawnObstacle() {
            obstacles.push({
                x: canvas.width,
                y: groundY - obstacleHeight,
                width: obstacleWidth,
                height: obstacleHeight
            });
        }

        // Update obstacles
        function updateObstacles() {
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= gameSpeed;

                // Remove off-screen obstacles
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    score++;
                    scoreElement.textContent = `Score: ${score}`;

                    // Increase difficulty
                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                    }
                }
            });
        }

        // Check collision
        function checkCollision() {
            const playerPixelSize = player.width / 10;
            const obstaclePixelSize = obstacleWidth / 6;

            obstacles.forEach(obstacle => {
                if (
                    player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y
                ) {
                    gameOver();
                }
            });
        }

        // Draw everything
        function draw() {
            drawBackground();

            // Draw player
            drawPixelArt(player.x, player.y, playerPixels, player.width / 10);

            // Draw obstacles
            obstacles.forEach(obstacle => {
                drawPixelArt(obstacle.x, obstacle.y, obstaclePixels, obstacleWidth / 6);
            });
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            frameCount++;

            updatePlayer();
            updateObstacles();
            checkCollision();

            // Spawn obstacles
            if (frameCount % 90 === 0) {
                spawnObstacle();
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            gameSpeed = 5;
            frameCount = 0;
            obstacles = [];
            player.y = 300;
            player.velocityY = 0;
            scoreElement.textContent = `Score: ${score}`;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameLoop();
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = `Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Touch support for iPad
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        // Prevent double-tap zoom on iPad
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Initial draw
        drawBackground();
        drawPixelArt(player.x, player.y, playerPixels, player.width / 10);
  </script>
</body>

</html>
