<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Dungeon Run</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #111116;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #222;
      border: 4px solid #444;
      border-radius: 4px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 95vw;
      max-height: 60vh;
    }

    /* iPad Touch Controls */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(3, 70px);
      gap: 8px;
      margin-top: 15px;
      touch-action: none;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    #up {
      grid-column: 2;
      grid-row: 1;
    }

    #left {
      grid-column: 1;
      grid-row: 2;
    }

    #right {
      grid-column: 3;
      grid-row: 2;
    }

    #down {
      grid-column: 2;
      grid-row: 3;
    }
  </style>
</head>

<body>

  <div id="game-container">
    <canvas id="game" width="320" height="240"></canvas>

    <!-- Virtual D-Pad for iPad -->
    <div id="dpad">
      <div class="btn" id="up">▲</div>
      <div class="btn" id="left">◀</div>
      <div class="btn" id="right">▶</div>
      <div class="btn" id="down">▼</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Asset Loader with Fallback Rendering
const images = {};
const assets = [
  { name: 'player', src: 'player.png' },
  { name: 'slime', src: 'slime.png' },
  { name: 'coin', src: 'coin.png' },
  { name: 'heart', src: 'heart.png' },
  { name: 'background', src: 'background.png' },
  { name: 'dust', src: 'vfx/dust.png' },
  { name: 'sparkle', src: 'vfx/sparkle.png' },
  { name: 'splat', src: 'vfx/splat.png' }
];

assets.forEach(asset => {
  images[asset.name] = new Image();
  images[asset.name].src = asset.src;
  images[asset.name].onload = () => { images[asset.name].loaded = true; };
  images[asset.name].onerror = () => { images[asset.name].loaded = false; };
});

// Game State
let score = 0;
let health = 3;
let gameOver = false;
let invincibilityTimer = 0;
const particles = [];

function spawnParticle(type, x, y, vx, vy, life, size = 16) {
  particles.push({ type, x, y, vx, vy, life, maxLife: life, size });
}

const keys = { up: false, down: false, left: false, right: false };

const player = { x: 144, y: 104, size: 32, speed: 2 };
const coin = { x: 50, y: 50, size: 16 };
const enemies = [
  { x: 30, y: 30, size: 32, vx: 1.5, vy: 1.2 },
  { x: 200, y: 150, size: 32, vx: -1.2, vy: 1.5 }
];

function spawnCoin() {
  coin.x = Math.floor(Math.random() * (canvas.width - coin.size - 20)) + 10;
  coin.y = Math.floor(Math.random() * (canvas.height - coin.size - 20)) + 10;
}

// Input Handlers
window.addEventListener('keydown', e => handleKey(e.key, true));
window.addEventListener('keyup', e => handleKey(e.key, false));

function handleKey(key, isPressed) {
  if (key === 'ArrowUp' || key === 'w' || key === 'W') keys.up = isPressed;
  if (key === 'ArrowDown' || key === 's' || key === 'S') keys.down = isPressed;
  if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.left = isPressed;
  if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.right = isPressed;
  if (gameOver && isPressed) resetGame();
}

function bindTouch(id, dir) {
  const btn = document.getElementById(id);
  const start = (e) => { 
    e.preventDefault(); 
    keys[dir] = true; 
    if (gameOver) resetGame(); 
  };
  const end = (e) => { 
    e.preventDefault(); 
    keys[dir] = false; 
  };
  
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('pointerleave', end);
}
bindTouch('up', 'up');
bindTouch('down', 'down');
bindTouch('left', 'left');
bindTouch('right', 'right');

function resetGame() {
  health = 3;
  score = 0;
  invincibilityTimer = 0;
  particles.length = 0;
  player.x = 144;
  player.y = 104;
  gameOver = false;
  spawnCoin();
}

// Collision Helper
function checkCollision(a, b) {
  return a.x < b.x + b.size &&
         a.x + a.size > b.x &&
         a.y < b.y + b.size &&
         a.y + a.size > b.y;
}

// Update Loop
let time = 0;
function update() {
  time += 0.15;
  if (invincibilityTimer > 0) invincibilityTimer--;

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.type === 'splat') p.vy += 0.15; // Gravity effect for splat
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (gameOver) return;

  player.isMoving = false;
  if (keys.up && player.y > 0) { player.y -= player.speed; player.isMoving = true; }
  if (keys.down && player.y < canvas.height - player.size) { player.y += player.speed; player.isMoving = true; }
  if (keys.left && player.x > 0) { player.x -= player.speed; player.isMoving = true; }
  if (keys.right && player.x < canvas.width - player.size) { player.x += player.speed; player.isMoving = true; }

  // Spawn walking dust
  if (player.isMoving && Math.random() < 0.3) {
    spawnParticle('dust', player.x + 8 + (Math.random() * 8), player.y + 20, (Math.random() - 0.5) * 0.5, -Math.random() * 0.4, 18, 16);
  }

  // Enemy movement & bounce
  enemies.forEach(enemy => {
    enemy.x += enemy.vx;
    enemy.y += enemy.vy;

    if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.size) enemy.vx *= -1;
    if (enemy.y <= 0 || enemy.y >= canvas.height - enemy.size) enemy.vy *= -1;

    // Hit Enemy
    if (invincibilityTimer <= 0 && checkCollision(player, enemy)) {
      health -= 1;
      invincibilityTimer = 60;
      for (let i = 0; i < 8; i++) {
        spawnParticle('splat', player.x + 8, player.y + 8, (Math.random() - 0.5) * 3, Math.random() * 2 + 1, 30, 16);
      }
      player.x = canvas.width / 2 - 16;
      player.y = canvas.height / 2 - 16;
      if (health <= 0) gameOver = true;
    }
  });

  // Collect Gem
  if (checkCollision(player, coin)) {
    score += 10;
    for (let i = 0; i < 6; i++) {
      spawnParticle('sparkle', coin.x + 4, coin.y + 4, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 22, 16);
    }
    spawnCoin();
  }
}

// Render Loop
function draw() {
  // Background Tile
  if (images.background.loaded) {
    ctx.drawImage(images.background, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#2d3732';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Coin
  if (images.coin.loaded) {
    ctx.drawImage(images.coin, coin.x, coin.y, coin.size, coin.size);
  } else {
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(coin.x, coin.y, coin.size, coin.size);
  }

  // Enemies
  enemies.forEach((enemy, index) => {
    ctx.save();
    const bounce = Math.abs(Math.sin(time + index)) * 4;
    const tilt = Math.cos(time + index) * 0.1;
    
    ctx.translate(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2 - bounce);
    ctx.rotate(tilt);
    
    if (images.slime.loaded) {
      ctx.drawImage(images.slime, -enemy.size / 2, -enemy.size / 2, enemy.size, enemy.size);
    } else {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-enemy.size / 2, -enemy.size / 2, enemy.size, enemy.size);
    }
    ctx.restore();
  });

  // Player
  if (invincibilityTimer % 6 < 3) {
    ctx.save();
    let pBounce = 0;
    let pTilt = 0;
    if (player.isMoving) {
      pBounce = Math.abs(Math.sin(time * 1.5)) * 5;
      pTilt = Math.cos(time * 1.5) * 0.15;
    }
    
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2 - pBounce);
    ctx.rotate(pTilt);
    
    if (images.player.loaded) {
      ctx.drawImage(images.player, -player.size / 2, -player.size / 2, player.size, player.size);
    } else {
      ctx.fillStyle = '#3498db';
      ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    }
    ctx.restore();
  }

  // Render Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    if (images[p.type] && images[p.type].loaded) {
      ctx.drawImage(images[p.type], p.x, p.y, p.size, p.size);
    } else {
      ctx.fillStyle = p.type === 'dust' ? '#aaa' : p.type === 'sparkle' ? '#ffd700' : '#e74c3c';
      ctx.fillRect(p.x, p.y, p.size / 2, p.size / 2);
    }
    ctx.restore();
  });

  // UI (Hearts & Score)
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.fillText(`SCORE: ${score}`, 10, 18);

  for (let i = 0; i < health; i++) {
    if (images.heart.loaded) {
      ctx.drawImage(images.heart, canvas.width - 24 - (i * 20), 8, 16, 16);
    } else {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(canvas.width - 24 - (i * 20), 8, 12, 12);
    }
  }

  // Game Over Screen
  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '16px monospace';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '10px monospace';
    ctx.fillText('Tap D-Pad or press key to restart', canvas.width / 2, canvas.height / 2 + 15);
    ctx.textAlign = 'left';
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
  </script>
</body>

</html>
